
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Sign Up Form UI</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Cercles décoratifs en arrière-plan -->
    <div class="bg-circle bg1"></div>
    <div class="bg-circle bg2"></div>
    <div class="bg-circle bg3"></div>
    <div class="bg-circle bg4"></div>

    <main class="card" id="card">

        <div class="lock-icon">
            <i class="fa-solid fa-lock" id="mainIcon"></i>
        </div>

        <h1 id="title">Welcome</h1>
        <p class="subtitle" id="subtitle">
            Login to continue your journey
        </p>

        <div class="separator"></div>

        <!-- Connexion -->
        <form id="loginForm" class="form active">

            <div class="input-box">
                <input type="email" name="email"
                       placeholder="Email Address" required>
            </div>

            <div class="input-box">
                <input type="password" name="password"
                       placeholder="Password" required>
                <i class="fa-regular fa-eye toggle-password"></i>
            </div>

            <div class="options">
                <label>
                    <input type="checkbox" name="remember">
                    <span>Remember me</span>
                </label>

                <a href="#" id="forgot">Forgot Password?</a>
            </div>

            <button class="submit-button" type="submit">
                Login
            </button>

        </form>

        <!-- Inscription -->
        <form id="signupForm" class="form">

            <div class="input-box">
                <input type="text" name="name"
                       placeholder="Full Name" required>
            </div>

            <div class="input-box">
                <input type="email" name="email"
                       placeholder="Email Address" required>
            </div>

            <div class="input-box">
                <input type="password" name="password"
                       placeholder="Password" minlength="8" required>
                <i class="fa-regular fa-eye toggle-password"></i>
            </div>

            <div class="input-box">
                <input type="password" name="confirmPassword"
                       placeholder="Confirm Password"
                       minlength="8" required>
            </div>

            <button class="submit-button" type="submit">
                Create Account
            </button>

        </form>

        <div class="bottom-text">
            <span id="bottomLabel">Don't have an account?</span>

            <button id="switchButton" type="button"
                    aria-label="Create an account">
                <i class="fa-solid fa-plus"></i>
            </button>
        </div>

    </main>

    <script src="script.js"></script>
</body>
</html>
